<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tic Tac Toe">
<link rel="icon" type="image/svg+xml" href="tictactoe-icon.svg">
<link rel="apple-touch-icon" href="https://pizzaemoji.net/games/tictactoe/tictactoe-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://pizzaemoji.net/games/tictactoe/">
<meta property="og:title" content="Tic Tac Toe">
<meta property="og:image" content="https://pizzaemoji.net/games/tictactoe/tictactoe-icon.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://pizzaemoji.net/games/tictactoe/tictactoe-icon.png">
<title>Tic Tac Toe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap');

  :root { --vh: 100vh; --purple: #b026ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    position: fixed; inset: 0; width: 100%; height: 100%;
    overflow: hidden; overscroll-behavior: none;
    background: #000; color: #fff;
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }

  #app {
    width: 100%; height: var(--vh);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 16px 56px;
  }

  .title {
    font-size: 20px; font-weight: 400; letter-spacing: 0.22em;
    color: #fff; margin-bottom: 14px; text-align: center;
  }
  .status {
    font-size: 40px; font-weight: 600; letter-spacing: 0.02em;
    color: #fff; text-align: center; height: 52px; line-height: 52px;
    margin-bottom: 22px;
  }

  #board {
    --size: min(88vw, calc(var(--vh) - 310px), 440px);
    width: var(--size); height: var(--size);
    max-width: 100%; display: block; flex-shrink: 0;
    overflow: visible;
  }
  .cell-hit { fill: transparent; cursor: pointer; }
  .grid-line { stroke: #fff; stroke-width: 4; stroke-linecap: round; }
  .x-outer { stroke: #fff; stroke-width: 26; stroke-linecap: round; }
  .x-inner { stroke: #000; stroke-width: 15; stroke-linecap: round; }
  .o-ring { fill: none; stroke: #fff; stroke-width: 20; }

  .pop { animation: pop 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.3) both; }
  @keyframes pop {
    from { transform: scale(0.55); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }

  .strike {
    stroke: var(--purple); stroke-width: 16; stroke-linecap: round; fill: none;
  }

  .score {
    margin-top: 26px; font-size: 30px; font-weight: 500;
    letter-spacing: 0.06em; color: #fff; text-align: center;
  }

  .branding {
    position: fixed; bottom: 30px; left: 0; right: 0; text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 1rem; font-weight: 400; color: #F5F0E8; letter-spacing: 0.02em;
  }
  #smallslice { height: 1rem; vertical-align: middle; margin-left: 2px; }
  .branding-link { color: inherit; text-decoration: none; }
  .branding-link:active { opacity: 0.7; }

  /* MODAL */
  .modal-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.88);
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #000; border: 2px solid #fff; border-radius: 16px;
    padding: 34px 36px 30px; text-align: center; width: 88%; max-width: 300px;
  }
  .modal-q { font-size: 30px; font-weight: 600; color: #fff; margin-bottom: 26px; }
  .modal-btns { display: flex; flex-direction: column; gap: 12px; }
  .modal-btn {
    font-family: inherit; font-size: 22px; font-weight: 600;
    padding: 14px 0; border-radius: 12px; border: 2px solid #fff; cursor: pointer;
  }
  .modal-btn:active { opacity: 0.8; }
  .modal-btn.yes { background: #fff; color: #000; }
  .modal-btn.no  { background: #000; color: #fff; }
</style>
</head>
<body>

<div id="app">
  <div class="title">tic tac toe</div>
  <div class="status" id="status"></div>
  <svg id="board" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
    <line class="grid-line" x1="100" y1="8"   x2="100" y2="292"/>
    <line class="grid-line" x1="200" y1="8"   x2="200" y2="292"/>
    <line class="grid-line" x1="8"   y1="100" x2="292" y2="100"/>
    <line class="grid-line" x1="8"   y1="200" x2="292" y2="200"/>
    <g id="marks"></g>
    <g id="strikeLayer"></g>
    <g id="hits"></g>
  </svg>
  <div class="score" id="score"></div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-q">Play again?</div>
    <div class="modal-btns">
      <button class="modal-btn yes" id="btnYes">Yes</button>
      <button class="modal-btn no"  id="btnNo">No</button>
    </div>
  </div>
</div>

<p class="branding"><a href="https://pizzaemoji.net/games" class="branding-link"><img src="/images/smallslice.webp" id="smallslice" alt="Small Slice icon"> Pizza Emoji Games</a></p>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const KEY = 'tictactoe_local';
  const MAX_AGE = 12 * 60 * 60 * 1000;

  const COLORS = ['#FF6685', '#FFB366', '#FFF066', '#66FF84', '#66E0FF', '#A366FF'];
  let board, turn, scores, over, winner, line, strikeColor, awaitingTap = false;

  const $ = id => document.getElementById(id);
  const marksEl = $('marks'), strikeEl = $('strikeLayer'), hitsEl = $('hits');
  const cx = i => (i % 3) * 100 + 50;
  const cy = i => Math.floor(i / 3) * 100 + 50;
  const other = p => p === 'X' ? 'O' : 'X';

  /* ── Viewport (no scroll, iOS-safe) ── */
  function setVH() { document.documentElement.style.setProperty('--vh', window.innerHeight + 'px'); }
  setVH();
  window.addEventListener('resize', setVH);
  window.addEventListener('orientationchange', setVH);
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  ['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(ev =>
    document.addEventListener(ev, e => e.preventDefault(), { passive: false }));

  /* ── Persistence ── */
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ ts: Date.now(), board, turn, scores, over, winner, line, strikeColor }));
    } catch (e) {}
  }
  function load() {
    try {
      const v = JSON.parse(localStorage.getItem(KEY));
      if (v && Date.now() - v.ts < MAX_AGE) return v;
    } catch (e) {}
    return null;
  }
  function clearSave() { try { localStorage.removeItem(KEY); } catch (e) {} }

  /* ── Drawing ── */
  function makeMark(i, p, animate) {
    const outer = document.createElementNS(NS, 'g');
    outer.setAttribute('transform', `translate(${cx(i)} ${cy(i)})`);
    const inner = document.createElementNS(NS, 'g');
    if (animate) inner.setAttribute('class', 'pop');
    if (p === 'X') {
      const d = 24;
      [['x-outer'], ['x-inner']].forEach(([cls]) => {
        [[-d, -d, d, d], [-d, d, d, -d]].forEach(([x1, y1, x2, y2]) => {
          const l = document.createElementNS(NS, 'line');
          l.setAttribute('class', cls);
          l.setAttribute('x1', x1); l.setAttribute('y1', y1);
          l.setAttribute('x2', x2); l.setAttribute('y2', y2);
          inner.appendChild(l);
        });
      });
    } else {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('class', 'o-ring');
      c.setAttribute('r', 28);
      inner.appendChild(c);
    }
    outer.appendChild(inner);
    marksEl.appendChild(outer);
  }

  function drawStrike(l, animate) {
    strikeEl.innerHTML = '';
    const a = l[0], b = l[2];
    let x1 = cx(a), y1 = cy(a), x2 = cx(b), y2 = cy(b);
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy), ext = 16;
    x1 -= dx / len * ext; y1 -= dy / len * ext;
    x2 += dx / len * ext; y2 += dy / len * ext;
    const s = document.createElementNS(NS, 'line');
    s.setAttribute('class', 'strike');
    s.style.stroke = strikeColor || COLORS[0];
    s.setAttribute('x1', x1); s.setAttribute('y1', y1);
    s.setAttribute('x2', x2); s.setAttribute('y2', y2);
    strikeEl.appendChild(s);
    if (animate) {
      const total = Math.hypot(x2 - x1, y2 - y1);
      s.style.strokeDasharray = total;
      s.style.strokeDashoffset = total;
      s.getBoundingClientRect();
      s.style.transition = 'stroke-dashoffset 0.45s cubic-bezier(0.5, 0, 0.3, 1)';
      s.style.strokeDashoffset = 0;
    }
  }

  function renderStatus() {
    const el = $('status');
    if (over === 'win') el.textContent = winner + ' wins';
    else if (over === 'draw') el.textContent = 'Draw';
    else el.textContent = turn + "'s turn";
  }
  function renderScore() { $('score').textContent = scores.X + ' \u2013 ' + scores.O; }

  function renderAll() {
    marksEl.innerHTML = ''; strikeEl.innerHTML = '';
    board.forEach((p, i) => { if (p) makeMark(i, p, false); });
    if (over === 'win' && line) drawStrike(line, false);
    renderStatus(); renderScore();
  }

  /* ── Hit areas ── */
  for (let i = 0; i < 9; i++) {
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('class', 'cell-hit');
    r.setAttribute('x', (i % 3) * 100); r.setAttribute('y', Math.floor(i / 3) * 100);
    r.setAttribute('width', 100); r.setAttribute('height', 100);
    r.addEventListener('click', () => onCell(i));
    hitsEl.appendChild(r);
  }

  /* ── Game flow ── */
  function newRound(starter) {
    board = Array(9).fill(null);
    turn = starter; over = null; winner = null; line = null; awaitingTap = false;
    $('modal').classList.remove('open');
    renderAll(); save();
  }

  function onCell(i) {
    if (over || board[i]) return;
    board[i] = turn;
    makeMark(i, turn, true);

    const hit = LINES.find(l => l.every(k => board[k] === turn));
    if (hit) {
      over = 'win'; winner = turn; line = hit;
      strikeColor = COLORS[Math.floor(Math.random() * COLORS.length)];
      scores[turn]++;
      drawStrike(hit, true);
      renderStatus(); renderScore(); save();
      setTimeout(() => { awaitingTap = true; }, 600);
    } else if (board.every(Boolean)) {
      over = 'draw';
      renderStatus(); save();
      setTimeout(() => { awaitingTap = true; }, 400);
    } else {
      turn = other(turn);
      renderStatus(); save();
    }
  }

  document.addEventListener('click', () => {
    if (!awaitingTap) return;
    awaitingTap = false;
    $('modal').classList.add('open');
  });

  $('btnYes').addEventListener('click', e => {
    e.stopPropagation();
    // X starts the first game; after a win the loser goes first; after a draw X starts
    newRound(over === 'win' ? other(winner) : 'X');
  });
  $('btnNo').addEventListener('click', e => {
    e.stopPropagation();
    clearSave();
    location.href = 'https://pizzaemoji.net/games';
  });

  /* ── Start (or pick up where we left off) ── */
  const saved = load();
  if (saved) {
    board = saved.board; turn = saved.turn; scores = saved.scores;
    over = saved.over; winner = saved.winner; line = saved.line; strikeColor = saved.strikeColor;
    renderAll();
    if (over) awaitingTap = true;
  } else {
    scores = { X: 0, O: 0 };
    newRound('X');
  }
})();
</script>
</body>
</html>
