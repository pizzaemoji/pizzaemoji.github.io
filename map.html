<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informal network map of an architecture firm</title>
<style>
:root{--bg:#fbfaf7;--text:#1f1e1c;--muted:#5f5d57;--border:rgba(0,0,0,.18);--card:#ffffff;--blue-f:#E6F1FB;--blue-s:#185FA5;--teal-f:#EEEDFE;--teal-s:#534AB7;--gray-f:#F1EFE8;--gray-s:#5F5E5A}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b19;--text:#ece9e0;--muted:#b4b0a4;--border:rgba(255,255,255,.22);--card:#262522;--blue-f:#0C447C;--blue-s:#85B7EB;--teal-f:#3C3489;--teal-s:#AFA9EC;--gray-f:#444441;--gray-s:#B4B2A9}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
html{overflow:auto}
#app{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;height:100vh;height:100dvh;min-height:620px;max-width:1500px;margin:0 auto;padding:12px 22px 14px;gap:8px}
h1{margin:0;font-size:24px;font-weight:600;line-height:1.2}
.sub{margin:3px 0 0;font-size:16px;color:var(--muted)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.chip{display:flex;align-items:center;gap:8px;font-size:16px;padding:7px 14px;border:1px solid var(--border);border-radius:999px;cursor:pointer;background:var(--card);user-select:none;-webkit-user-select:none}
.chip input{width:18px;height:18px;margin:0;cursor:pointer}
.chip svg{flex:none}
button{font:inherit;font-size:16px;padding:7px 16px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);cursor:pointer}
button:hover,.chip:hover{border-color:var(--muted)}
.mapwrap{position:relative;min-height:0}
#map{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.nm{font-size:15px;font-weight:600;fill:var(--text)}
.sb{font-size:13px;fill:var(--muted)}
.fl{fill:var(--text);stroke:var(--bg);stroke-width:5;paint-order:stroke;stroke-linejoin:round}
.blue{fill:var(--blue-f);stroke:var(--blue-s)}
.teal{fill:var(--teal-f);stroke:var(--teal-s)}
.gray{fill:var(--gray-f);stroke:var(--gray-s)}
.node{cursor:pointer;outline:none}
.node:focus .focus{stroke:var(--text);stroke-width:2}
.lg{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--muted);align-items:center}
.lg span{display:inline-flex;align-items:center;gap:5px}
.pn{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 18px;font-size:17px;line-height:1.5;overflow:auto;max-height:30vh;min-height:104px}
.pn .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.pn .ttl{font-weight:600;font-size:19px}
.pn .tag{font-size:14px;color:var(--muted)}
.pn p{margin:0 0 6px}
.pn .cn{font-size:15px;color:var(--muted);line-height:1.6}
.pn .cn b{font-weight:600;color:var(--text)}
.pn .ainote{color:var(--muted);font-size:16px}
@media (max-width:700px){#app{padding:10px 12px}h1{font-size:20px}.sub{font-size:14px}.chip,button{font-size:14px;padding:6px 10px}.pn{font-size:15px}}
</style>
</head>
<body>
<div id="app">
<header>
<h1>How the firm really worked: an informal organizational network map</h1>
<p class="sub">A 40-person architecture firm, mapped from the inside.</p>
</header>
<div class="ctl" id="ctl">
<label class="chip"><input type="checkbox" id="fi" checked><svg width="30" height="8"><line x1="1" y1="4" x2="29" y2="4" stroke="#1D9E75" stroke-width="2.5"/></svg>Informal connections</label>
<label class="chip"><input type="checkbox" id="fr" checked><svg width="30" height="8"><line x1="1" y1="4" x2="29" y2="4" stroke="#D9A000" stroke-width="2.5"/></svg>IT requests</label>
<label class="chip"><input type="checkbox" id="fo" checked><svg width="30" height="8"><line x1="1" y1="4" x2="29" y2="4" stroke="#378ADD" stroke-width="2.5"/></svg>Reporting and approvals</label>
<label class="chip"><input type="checkbox" id="ff" checked><svg width="30" height="8"><line x1="1" y1="4" x2="29" y2="4" stroke="#DB4F9B" stroke-width="2.5"/></svg>Outside of work connections</label>
<label class="chip"><input type="checkbox" id="fb" checked><svg width="18" height="18"><circle cx="9" cy="9" r="7" fill="none" stroke="#E24B4A" stroke-width="2" stroke-dasharray="4 3"/></svg>Bottlenecks</label>
</div>
<div class="mapwrap">
<svg id="map" viewBox="0 0 900 500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Network map of a 40-person architecture firm. Shape and color show formal or relational influence. A shaded region marks the open floor. Lines show informal connections, IT requests, reporting and approvals, and my outside of work connections. Red dashed rings mark bottlenecks.">
<defs>
<marker id="ar-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D9A000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar-f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#DB4F9B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g id="R"></g><g id="E"></g><g id="V"></g>
</svg>
</div>
<div class="lg" id="lg"></div>
<div class="pn" id="pn" aria-live="polite"></div>
</div>
<script>
var NS='http://www.w3.org/2000/svg';
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
var CLS={formal:'blue',relational:'teal',low:'gray'};
var TN={formal:'Formal influence',relational:'Relational influence',low:'External or little influence'};
var N=[
{id:'you',l:'Me (IT)',s:'IT coordinator',t:'relational',bn:1,n:'As the IT Coordinator, I held the lowest formal rank in the room, but with the widest reach. Everyone uses a computer, so everyone needs me eventually. I reported to the principals. Every IT request, whether hardware or software, ran through me, so when I was buried in another project or on PTO, everyone waited. I prioritized the principals, the accountant, and the senior architects; for everyone else, whoever I liked more personally got priority. That is informal power: I decided who waited. I split my time between the open floor and working in my cubicle, so I straddled that line.'},
{id:'prin',l:'Principals',s:'4 leaders',t:'formal',bn:1,n:'Four leaders are, figuratively and literally, at the top of every reporting line. They worked with everyone and were very approachable, so they connect to every role except the vendors. Principal approval was also the biggest bottleneck: anything that needed a sign-off waited on busy people who were each juggling several projects and were often out of the office or in meetings.'},
{id:'sen',l:'Senior architects',s:'6 people',t:'formal',n:'Reported to the principals, and the project and junior architects reported to them. Formal seniority and near the top of my queue. Each was working on two or three things at once, so a request that needed their input could stall. They worked with marketing and with the render champion.'},
{id:'prj',l:'Project architects',s:'12 people',t:'relational',n:'Reported to the senior architects. The collaboration engine of the firm: anyone could ask anyone for specialized knowledge or additional manpower, so information moved sideways around the org chart, mostly on the open floor. A couple of people leaned on IT for things they could have done themselves, which stretched my queue.'},
{id:'jun',l:'Junior architects',s:'10 people',t:'low',n:'Reported to the senior architects. Least formal power, and mostly last in my IT queue, though I had some personal friendships here. They relied on project architects for information and on me for tech support.'},
{id:'chp',l:'Render champion',s:'Visual design lead',t:'relational',n:'She reported to the principals. She championed the render farm and benefited most from it. As the visual design lead she could produce 3D videos of the buildings, and she took much of the credit for the work I did. The farm cost the firm nothing extra because it used idle workstations overnight. For me it meant hand-configuring about 30 workstations (IT, accounting, and principals were not allowed to participate for "IT security reasons"). It also meant spending mornings bringing machines back after overnight failures. As the project went on I stepped back and let her do the work, since I was not getting credit. She worked with me, the principals, the senior architects, and the office assistant.'},
{id:'oa',l:'Office assistant',s:'Does everything',t:'relational',bn:1,n:'He reports to the office manager and did everything: fetched documents from storage, prepped for meetings, handled mail and vendors, and even the backup receptionist. He seemed to like being kept busy. Near the top of my queue. One of the strongest brokers in the firm. Because so many people depend on him, he is also a bottleneck at times, especially when he is offsite on a run.'},
{id:'om',l:'Office manager',s:'HR and overhead',t:'formal',n:'Reports to the principals and sits above the office assistant and the receptionist in an HR and overhead role. I never figured out what she does all day, so her influence on how work actually got done is a blank spot on this map. May have been the best Solitaire player in the office.'},
{id:'rec',l:'Receptionist',s:'Front desk',t:'relational',n:'Reports to the office manager. One of my closest friendships at work, and also one of the lowest in my queue. Sees who is in, who is stressed, and the day\'s agenda, and tips me off early. Often ate lunch together. Combined, we knew ALL the office gossip.'},
{id:'acc',l:'Accountant',s:'Controls spending',t:'formal',n:'Reports to the principals. Controls spending and sat near the top of my queue. Along with the principals, had access to some secure encrypted network shares that even I did not have official access to open.'},
{id:'mkt',l:'Marketing',s:'3 people',t:'relational',n:'Reports to the principals. I worked with them on website and printing issues, and they worked with the principals and the senior architects. Some of my closest friendships were here. Eventually we pitched and were approved to form a small video production studio in the office with a small budget. We filmed interviews, buildings, special events, and "behind-the-scenes" at the office.'},
{id:'ship',l:'Mail and vendors',s:'Outside the firm',t:'low',bn:1,n:'Marketing, the office assistant, and IT were the main contacts for vendors, and the office assistant dealt with them constantly. A late box could stall a project, which makes this a bottleneck at times.'}
];
var POS={prin:[450,150],you:[450,310],oa:[331,74],sen:[139,141],prj:[65,250],chp:[139,359],jun:[331,426],ship:[569,74],om:[761,141],rec:[835,250],mkt:[761,359],acc:[569,426]};
var E0=['prin,prj,i,=,1','prin,jun,i,=,1','prin,rec,i,=,1','oa,prin,i,=,3','prin,you,i,=,2',
'oa,rec,i,=,2','oa,ship,i,=,3','rec,ship,i,=,1','prj,jun,i,=,3','sen,chp,i,=,2','mkt,sen,i,=,2','chp,oa,i,=,2',
'you,oa,i,=,3','oa,sen,i,=,3','oa,prj,i,=,3','oa,jun,i,=,3','you,rec,i,=,2','you,mkt,i,=,2','you,chp,i,=,2','you,ship,i,=,2',
'you,prin,o,>,3','sen,prin,o,>,3','acc,prin,o,>,2','chp,prin,o,>,2','mkt,prin,o,>,2','om,prin,o,>,2','prj,sen,o,>,3','jun,sen,o,>,3','oa,om,o,>,2','rec,om,o,>,2','ship,mkt,o,>,1','ship,you,o,>,1','ship,oa,o,>,1',
'prin,you,r,>,3','oa,you,r,>,3','sen,you,r,>,2','prj,you,r,>,2','jun,you,r,>,1','mkt,you,r,>,2','chp,you,r,>,2','rec,you,r,>,1','acc,you,r,>,3','om,you,r,>,1',
'you,mkt,f,=,3','you,rec,f,=,3','you,jun,f,=,2'];
var M={},E=[];
N.forEach(function(n){M[n.id]=n;n.d=0;n.x=POS[n.id][0];n.y=POS[n.id][1]});
E0.forEach(function(s){var p=s.split(',');E.push({a:p[0],b:p[1],t:p[2],d:p[3],w:+p[4]});M[p[0]].d++;M[p[1]].d++});
N.forEach(function(n){n.r=Math.max(12,9+n.d*1.1)});
var sel=null;
var EC={i:'#1D9E75',r:'#D9A000',f:'#DB4F9B',o:'#378ADD'};
var OFF={i:-12,r:12,f:26,o:0};
function icon(t){var s='<svg width="20" height="20" style="flex:none">';
if(t==='formal')s+='<rect class="'+CLS[t]+'" x="2.5" y="2.5" width="15" height="15" rx="2" stroke-width="1.4"/>';
else s+='<circle class="'+CLS[t]+'" cx="10" cy="10" r="7.5" stroke-width="1.4"/>';
return s+'</svg>'}
var sym='<svg width="22" height="18"><rect x="1.5" y="2.5" width="19" height="13" rx="4" fill="#7F77DD" fill-opacity="0.2" stroke="#7F77DD" stroke-dasharray="3 2"/></svg>';
var rg='<svg width="20" height="20"><circle cx="10" cy="10" r="7.5" fill="none" stroke="#E24B4A" stroke-width="2" stroke-dasharray="4 3"/></svg>';
document.getElementById('lg').innerHTML='<span>'+icon('formal')+'Formal (title, budget)</span><span>'+icon('relational')+'Relational (trust, access)</span><span>'+icon('low')+'External or little influence</span><span>'+sym+'Open floor (symbolic influence shared by everyone)</span><span>Bigger shape = more connections</span><span>Thicker line = more traffic or priority</span>';
function hull(P){P=P.slice().sort(function(a,b){return a[0]-b[0]||a[1]-b[1]});
function cr(o,a,b){return (a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0])}
var L=[],U=[],i,p;
for(i=0;i<P.length;i++){p=P[i];while(L.length>=2&&cr(L[L.length-2],L[L.length-1],p)<=0)L.pop();L.push(p)}
for(i=P.length-1;i>=0;i--){p=P[i];while(U.length>=2&&cr(U[U.length-2],U[U.length-1],p)<=0)U.pop();U.push(p)}
U.pop();L.pop();return L.concat(U)}
var FLOOR=['oa','sen','prj','chp','jun'];
function floor(R){
var P=44,pts=FLOOR.map(function(id){return [M[id].x,M[id].y]});
var cx=0,cy=0;pts.forEach(function(p){cx+=p[0];cy+=p[1]});cx/=pts.length;cy/=pts.length;
var me=M.you,dx=cx-me.x,dy=cy-me.y,L=Math.sqrt(dx*dx+dy*dy);
pts.push([me.x+dx/L*P,me.y+dy/L*P]);
var h=hull(pts),d='M'+h.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1)}).join('L')+'Z';
var g=el('g',{opacity:0.13},R);
el('path',{d:d,fill:'#7F77DD',stroke:'#7F77DD','stroke-width':P*2,'stroke-linejoin':'round'},g);
var t1=el('text',{class:'nm fl',x:cx-6,y:cy-6,'text-anchor':'middle'},R);t1.textContent='Open floor';
var t2=el('text',{class:'sb fl',x:cx-6,y:cy+12,'text-anchor':'middle'},R);t2.textContent='Where the real talking happened';
}
function render(){
var R=document.getElementById('R'),G=document.getElementById('E'),V=document.getElementById('V');R.innerHTML='';G.innerHTML='';V.innerHTML='';
floor(R);
var on={i:document.getElementById('fi').checked,r:document.getElementById('fr').checked,f:document.getElementById('ff').checked,o:document.getElementById('fo').checked};
var nb={};
E.forEach(function(e){if(sel&&(e.a===sel||e.b===sel)){nb[e.a]=1;nb[e.b]=1}});
E.forEach(function(e){
if(!on[e.t])return;
var A=M[e.a],B=M[e.b];
var dx=B.x-A.x,dy=B.y-A.y,L=Math.sqrt(dx*dx+dy*dy),ux=dx/L,uy=dy/L;
var cdx=e.a<e.b?dx:-dx,cdy=e.a<e.b?dy:-dy,nx=-cdy/L,ny=cdx/L;
var s0=A.r+3,e0=B.r+(e.d==='>'?8:3);
var sx=A.x+ux*s0,sy=A.y+uy*s0,ex=B.x-ux*e0,ey=B.y-uy*e0;
var o=OFF[e.t]*2,cx=(sx+ex)/2+nx*o,cy=(sy+ey)/2+ny*o;
var hit=!sel||e.a===sel||e.b===sel;
var p=el('path',{d:'M'+sx+' '+sy+' Q'+cx+' '+cy+' '+ex+' '+ey,fill:'none',stroke:EC[e.t],'stroke-width':0.6+e.w*0.7,'stroke-linecap':'round',opacity:hit?(sel?0.95:0.6):0.07},G);
if(e.d==='>')p.setAttribute('marker-end','url(#ar-'+e.t+')');
});
N.forEach(function(n){
var g=el('g',{class:'node',tabindex:0,role:'button','aria-label':n.l+', '+TN[n.t],opacity:(sel&&!nb[n.id]&&n.id!==sel)?0.3:1},V);
var sw=n.id===sel?3:1.4;
if(document.getElementById('fb').checked&&n.bn)el('circle',{cx:n.x,cy:n.y,r:n.r+7,fill:'none',stroke:'#E24B4A','stroke-width':2,'stroke-dasharray':'4 3'},g);
if(n.t==='formal'){var h=n.r*0.85;el('rect',{class:'focus '+CLS[n.t],x:n.x-h,y:n.y-h,width:h*2,height:h*2,rx:3,'stroke-width':sw},g)}
else el('circle',{class:'focus '+CLS[n.t],cx:n.x,cy:n.y,r:n.r,'stroke-width':sw},g);
var above=n.y<250,gap=n.bn?13:7,ty;
if(above){ty=n.y-n.r-gap-17}else{ty=n.y+n.r+gap+13}
var t1=el('text',{class:'nm',x:n.x,y:ty,'text-anchor':'middle'},g);t1.textContent=n.l;
var t2=el('text',{class:'sb',x:n.x,y:ty+15,'text-anchor':'middle'},g);t2.textContent=n.s;
g.addEventListener('click',function(){sel=(sel===n.id)?null:n.id;render();panel()});
g.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();sel=(sel===n.id)?null:n.id;render();panel()}});
});
}
function panel(){
var p=document.getElementById('pn');
if(!sel){p.innerHTML='<div class="hd"><span class="ttl">Start anywhere — </span>Click a role to see how it connects, click again to clear it; use the checkboxes above to isolate connections.</div><p><strong>Map Overview:</strong> I was the firm\'s IT Coordinator for 8 years, from 2007–2015. I worked there because I liked the people and the job was easy — two terrible reasons to remain at a dead-end job for 8 years. The floor was an open-office design where communication and collaboration happened freely and spontaneously. Principals and office support (IT, Marketing, Accounting) were bundled in cubicles. In a small firm like this everyone wears several hats, so status and knowledge may shift with the project. That is why symbolic influence is the shaded floor rather than specific individuals.</p><p><strong>Connections:</strong> "Informal connections" show who actually exchanged information and got things done together, while "Reporting and approvals" are the official office hierarchy. I also chose to show my friendships "outside of work" and the IT requests that came to me from every role in the office. From my viewpoint, I\'m the center of the office.</p><p><strong>Key Takeaway:</strong> By exploring this organizational network map, it becomes clear that within a small office, information doesn\'t follow a clean line of reporting, but instead it flows between roles, over cubicle walls, and across lunch tables.</p><p class="ainote">This interactive map was made with the assistance of Claude AI. Connections and layout were drafted by me, and all role descriptions were written by me. Claude wrote the code, identified typos, and offered feedback on the overall presentation. We "worked together" on node placement, colors, and UI/UX layouts.</p>';return}
var n=M[sel],G={i:[],f:[],ro:[],ri:[],oo:[],oi:[]};
E.forEach(function(e){
var other=e.a===sel?e.b:(e.b===sel?e.a:null);
if(!other)return;
var nm=M[other].l;
if(e.t==='i')G.i.push(nm);
else if(e.t==='f')G.f.push(nm);
else if(e.t==='r'){if(e.a===sel)G.ro.push(nm);else G.ri.push(nm)}
else if(e.t==='o'){if(e.a===sel)G.oi.push(nm);else G.oo.push(nm)}
});
var rows=[['Reports to',G.oi],['Direct reports',G.oo],['Sends IT requests to',G.ro],['Receives IT requests from',G.ri],['Informal connections',G.i],['Outside of work connections',G.f]];
var h='<div class="hd">'+icon(n.t)+'<span class="ttl">'+n.l+'</span><span class="tag">'+TN[n.t]+(n.bn?' · bottleneck':'')+'</span></div>';
h+='<p>'+n.n+'</p><div class="cn">';
rows.forEach(function(r){if(r[1].length)h+='<div><b>'+r[0]+':</b> '+r[1].join(', ')+'</div>'});
p.innerHTML=h+'</div>';
}
['fi','fr','ff','fo','fb'].forEach(function(id){document.getElementById(id).addEventListener('change',render)});
document.getElementById('map').addEventListener('click',function(ev){if(!ev.target.closest('.node')){sel=null;render();panel()}});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'){sel=null;render();panel()}});
render();panel();
</script>
</body>
</html>
