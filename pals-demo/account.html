<!DOCTYPE html>
<html lang="en">
<head>
	<title>Pals | Account Management</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="light dark">
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="pals.js"></script>
	<style>
		.no-scrollbar::-webkit-scrollbar { display: none; }
		.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
	</style>
</head>
<body class="bg-white dark:bg-black antialiased transition-colors duration-200">
	<div class="w-full h-dvh flex flex-col bg-white dark:bg-black relative overflow-hidden mx-auto max-w-2xl">
		<header class="w-full flex justify-between items-center px-6 pt-3 pb-3 shrink-0 bg-white/90 dark:bg-black/90 backdrop-blur-md z-50 border-b border-zinc-50 dark:border-zinc-900">
			<a href="prefs.html" class="w-12 text-zinc-800 dark:text-zinc-200 active:scale-90 transition-transform">
				<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
					<path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
				</svg>
			</a>
			<img src="images/Pals_Logo.png" alt="Pals" class="h-8 w-auto object-contain">
			<div class="w-12"></div>
		</header>
		<main class="flex-1 overflow-y-auto no-scrollbar px-8 pt-8 pb-24 text-zinc-900 dark:text-zinc-100">
			<section class="space-y-8 mb-20">
				<div class="space-y-2">
					<p class="text-zinc-900 dark:text-zinc-100 text-2xl font-bold">
						Account Settings
					</p>
				</div>
				<div class="space-y-4">
					<button class="w-full flex items-center justify-between h-6 text-zinc-800 dark:text-zinc-200 text-lg font-normal">
						<span>Change Phone Number (Disabled)</span>
						<span class="text-zinc-400">›</span>
					</button>
					<p class="text-zinc-600 dark:text-zinc-400 text-base font-normal">
					</p>
				</div>
				<div class="space-y-4">
					<button class="w-full flex items-center justify-between h-6 text-zinc-800 dark:text-zinc-200 text-lg font-normal">
						<span>View Hidden Users (Disabled)</span>
						<span class="text-zinc-400">›</span>
					</button>
					<p class="text-zinc-600 dark:text-zinc-400 text-base font-normal">
					</p>
				</div>
				<div class="space-y-4">
					<button class="w-full flex items-center justify-between h-6 text-zinc-800 dark:text-zinc-200 text-lg font-normal">
						<span>View Blocked Users (Disabled)</span>
						<span class="text-zinc-400">›</span>
					</button>
					<p class="text-zinc-600 dark:text-zinc-400 text-base font-normal">
					</p>
				</div>
				<div class="space-y-2">
					<p class="text-zinc-900 dark:text-zinc-100 text-xl font-bold">
						&nbsp;
					</p>
				</div>
				<div class="space-y-4">
					<button onclick="window.location.href='delete.html'" class="w-full flex items-center justify-between h-6 text-zinc-800 dark:text-zinc-200 text-lg font-normal">
						<span>Delete Pals Account</span>
						<span class="text-zinc-400">›</span>
					</button>
					<p class="text-zinc-600 dark:text-zinc-400 text-base font-normal">
						We'll miss you
					</p>
				</div>
			</section>
		</main>
	</div>
</body>
</html>
