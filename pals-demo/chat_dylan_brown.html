<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light dark">
    <title>Pals | Chat with Dylan Brown</title>
    <script src="https://cdn.tailwindcss.com"></script>
	<script src="pals.js"></script>
	<script>
		// Scroll chat to bottom on load
		document.addEventListener('DOMContentLoaded', () => {
		const lastMessage = document.querySelector('#chat-container > div:last-child');
		if (lastMessage) lastMessage.scrollIntoView({ block: 'end' });
	});

		// Feature menu toggle
		function toggleFeatureMenu(e) {
			e.stopPropagation();
			const menu = document.getElementById('featureMenu');
			menu.classList.toggle('hidden');
		}
		window.addEventListener('click', function(e) {
			const menu = document.getElementById('featureMenu');
			const moreButton = document.getElementById('moreButton');
			if (!menu.classList.contains('hidden') && !menu.contains(e.target) && !moreButton.contains(e.target)) {
				menu.classList.add('hidden');
			}
		});
		// Text input panel toggle
		function toggleTextInput() {
			const panel = document.getElementById('textInputPanel');
			const field = document.getElementById('textInputField');
			const isOpen = panel.classList.contains('max-h-20');
			if (isOpen) {
				panel.classList.remove('max-h-20', 'opacity-100', 'translate-y-0');
				panel.classList.add('max-h-0', 'opacity-0', '-translate-y-1');
				field.blur();
			} else {
				closeVoicePanel();
				closeCameraPanel();
				panel.classList.remove('max-h-0', 'opacity-0', '-translate-y-1');
				panel.classList.add('max-h-20', 'opacity-100', 'translate-y-0');
				setTimeout(() => field.focus(), 150);
			}
		}
		window.addEventListener('click', function(e) {
			const panel = document.getElementById('textInputPanel');
			const chatButton = document.getElementById('chatButton');
			if (panel.classList.contains('max-h-20') && !panel.contains(e.target) && !chatButton.contains(e.target)) {
				toggleTextInput();
			}
		});

		// Voice recording panel toggle
		let voiceTimerInterval = null;
		let voiceSeconds = 0;

		function closeTextPanel() {
			const panel = document.getElementById('textInputPanel');
			if (!panel.classList.contains('max-h-20')) return;
			const field = document.getElementById('textInputField');
			panel.classList.remove('max-h-20', 'opacity-100', 'translate-y-0');
			panel.classList.add('max-h-0', 'opacity-0', '-translate-y-1');
			field.blur();
		}

		function closeVoicePanel() {
			const panel = document.getElementById('voicePanel');
			if (!panel.classList.contains('max-h-20')) return;
			panel.classList.remove('max-h-20', 'opacity-100', 'translate-y-0');
			panel.classList.add('max-h-0', 'opacity-0', '-translate-y-1');
			clearInterval(voiceTimerInterval);
			voiceSeconds = 0;
			document.getElementById('voiceTimer').textContent = '0:00';
		}

		function toggleVoiceRecording() {
			const panel = document.getElementById('voicePanel');
			const isOpen = panel.classList.contains('max-h-20');
			if (isOpen) {
				closeVoicePanel();
			} else {
				closeTextPanel();
				closeCameraPanel();
				panel.classList.remove('max-h-0', 'opacity-0', '-translate-y-1');
				panel.classList.add('max-h-20', 'opacity-100', 'translate-y-0');
				voiceSeconds = 0;
				const timerEl = document.getElementById('voiceTimer');
				voiceTimerInterval = setInterval(() => {
					voiceSeconds++;
					const mins = Math.floor(voiceSeconds / 60);
					const secs = String(voiceSeconds % 60).padStart(2, '0');
					timerEl.textContent = `${mins}:${secs}`;
				}, 1000);
			}
		}
		window.addEventListener('click', function(e) {
			const panel = document.getElementById('voicePanel');
			const voiceButton = document.getElementById('voiceButton');
			if (panel.classList.contains('max-h-20') && !panel.contains(e.target) && !voiceButton.contains(e.target)) {
				closeVoicePanel();
			}
		});

		// Camera placeholder panel toggle
		function closeCameraPanel() {
			const panel = document.getElementById('cameraPanel');
			if (!panel.classList.contains('max-h-20')) return;
			panel.classList.remove('max-h-20', 'opacity-100', 'translate-y-0');
			panel.classList.add('max-h-0', 'opacity-0', '-translate-y-1');
		}

		function toggleCameraPanel() {
			const panel = document.getElementById('cameraPanel');
			const isOpen = panel.classList.contains('max-h-20');
			if (isOpen) {
				closeCameraPanel();
			} else {
				closeTextPanel();
				closeVoicePanel();
				panel.classList.remove('max-h-0', 'opacity-0', '-translate-y-1');
				panel.classList.add('max-h-20', 'opacity-100', 'translate-y-0');
			}
		}
		window.addEventListener('click', function(e) {
			const panel = document.getElementById('cameraPanel');
			const cameraButton = document.getElementById('cameraButton');
			if (panel.classList.contains('max-h-20') && !panel.contains(e.target) && !cameraButton.contains(e.target)) {
				closeCameraPanel();
			}
		});
	</script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Locks the viewport to prevent whole-page scrolling */
        html, body {
            position: fixed;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        /* Live recording waveform bars */
        @keyframes bar-toggle {
            0% { transform: scaleY(0.35); }
            100% { transform: scaleY(1); }
        }
        .voice-bar {
            transform-origin: center;
            animation: bar-toggle 0.5s ease-in-out infinite alternate;
        }
    </style>
</head>
<body class="bg-white dark:bg-black antialiased selection:bg-red-100">
    <div class="w-full h-full flex flex-col bg-white dark:bg-black relative overflow-hidden mx-auto max-w-2xl">    
        <header class="flex items-center px-4 py-4 shrink-0 z-50 bg-white/20 dark:bg-black/20 backdrop-blur-md border-b border-zinc-50 dark:border-zinc-900">
            <a href="index.html" class="w-10 text-zinc-900 dark:text-white active:scale-90 transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                </svg>
            </a>
			<div class="flex flex-1 items-center ml-2">
				<a href="profile_dylan_brown.html" class="flex items-center gap-3">
					<img src="images/icon_dylan_brown.png" alt="Dylan Brown" class="w-12 h-12 rounded-full object-cover">
					<h1 class="font-medium text-zinc-900 dark:text-white text-2xl">
						Dylan Brown
					</h1>
				</a>
			</div>
			<div class="flex gap-6 text-red-500 pr-2">
				<button aria-label="Audio Call" class="active:scale-90 transition-transform">
					<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
						<path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-2.824-1.435-5.125-3.736-6.56-6.56l1.293-.97c.362-.271.527-.734.417-1.173L6.946 5.768a1.125 1.125 0 00-1.091-.852H3.622a2.25 2.25 0 00-2.185 1.907c-.054.38-.112.757-.175 1.134z" />
                    </svg>
				</button>
				<button aria-label="Video Call" class="active:scale-90 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5l4.72-4.72a.75.75 0 011.28.53v11.38a.75.75 0 01-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 002.25-2.25v-9a2.25 2.25 0 00-2.25-2.25h-9A2.25 2.25 0 002.25 7.5v9a2.25 2.25 0 002.25 2.25z" />
                    </svg>
                </button>
            </div>
        </header>
<main id="chat-container" class="flex-1 min-h-0 overflow-y-auto px-4 py-6 no-scrollbar space-y-4">
	<div class="flex justify-start">
		<div class="bg-zinc-100 dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100 px-4 py-3 rounded-2xl rounded-tl-none max-w-[80%] text-base shadow-sm">
			Hey big sur this weekend? Waves look sick
		</div>
	</div>
	<div class="flex justify-end">
		<div class="bg-red-500 text-zinc-100 px-4 py-3 rounded-2xl rounded-tr-none max-w-[80%] text-base shadow-sm">
			Can't 😭
		</div>
	</div>
	<div class="flex justify-start">
		<div class="bg-zinc-100 dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100 px-4 py-3 rounded-2xl rounded-tl-none max-w-[80%] text-base shadow-sm">
			Okay next time
		</div>
	</div>
	<div class="flex justify-end">
		<div class="bg-red-500 text-zinc-100 px-4 py-3 rounded-2xl rounded-tr-none max-w-[80%] text-base shadow-sm">
			Deal
		</div>
	</div>
        </main>
        <div id="featureMenu" class="hidden absolute bottom-24 right-6 w-48 bg-white/90 dark:bg-zinc-900/90 backdrop-blur-xl rounded-2xl shadow-2xl border border-gray-100 dark:border-zinc-800 z-[60] overflow-hidden">
            <div class="flex flex-col">
                <button onclick="toggleFeatureMenu(event)" class="px-4 py-3 text-left text-[15px] text-zinc-800 dark:text-zinc-200 active:bg-zinc-100 dark:active:bg-zinc-800 flex items-center gap-3 border-b border-gray-50 dark:border-zinc-800">
                    <span>🌌</span> Select a Photo
                </button>
                <button onclick="toggleFeatureMenu(event)" class="px-4 py-3 text-left text-[15px] text-zinc-800 dark:text-zinc-200 active:bg-zinc-100 dark:active:bg-zinc-800 flex items-center gap-3 border-b border-gray-50 dark:border-zinc-800">
                    <span>📍</span> Share Location
                </button>
                <button onclick="toggleFeatureMenu(event)" class="px-4 py-3 text-left text-[15px] text-zinc-800 dark:text-zinc-200 active:bg-zinc-100 dark:active:bg-zinc-800 flex items-center gap-3 border-b border-gray-50 dark:border-zinc-800">
                    <span>✏️</span> Doodle
                </button>
                <button onclick="toggleFeatureMenu(event)" class="px-4 py-3 text-left text-[15px] text-zinc-800 dark:text-zinc-200 active:bg-zinc-100 dark:active:bg-zinc-800 flex items-center gap-3">
                    <span>🤍</span> Stickers
                </button>
            </div>
        </div>
        <div id="input-bar" class="p-4 bg-white dark:bg-black border-t border-gray-100 dark:border-zinc-900 z-50 shrink-0">
            <div class="flex items-center gap-2">
                <button id="chatButton" onclick="toggleTextInput()" class="flex-1 h-8 rounded-[10px] border-2 border-red-500 bg-white dark:bg-black flex items-center justify-center active:scale-95 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#ef4444" class="w-6 h-6 scale-x-[1.3]">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z" />
                    </svg>
                </button>
                <button id="voiceButton" onclick="toggleVoiceRecording()" class="flex-1 h-8 rounded-[10px] border-2 border-red-500 bg-white dark:bg-black flex items-center justify-center gap-[3px] active:scale-95 transition-transform">
                    <span class="w-[2px] h-2 bg-red-500 rounded-full"></span>
                    <span class="w-[2px] h-4 bg-red-500 rounded-full"></span>
                    <span class="w-[2px] h-5 bg-red-500 rounded-full"></span>
                    <span class="w-[2px] h-3 bg-red-500 rounded-full"></span>
                    <span class="w-[2px] h-4 bg-red-500 rounded-full"></span>
                    <span class="w-[2px] h-2 bg-red-500 rounded-full"></span>
                </button>
                <button id="cameraButton" onclick="toggleCameraPanel()" class="flex-1 h-8 rounded-[10px] border-2 border-red-500 bg-white dark:bg-black flex items-center justify-center active:scale-95 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#ef4444" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Z" />
                    </svg>
                </button>
                <button id="moreButton" onclick="toggleFeatureMenu(event)" class="w-11 h-8 rounded-[10px] border-2 border-red-500 bg-white dark:bg-black flex items-center justify-center gap-[3px] active:scale-95 transition-transform shrink-0">
                    <span class="w-1 h-1 bg-red-500 rounded-full"></span>
                    <span class="w-1 h-1 bg-red-500 rounded-full"></span>
                    <span class="w-1 h-1 bg-red-500 rounded-full"></span>
                </button>
            </div>
            <div id="textInputPanel" class="max-h-0 opacity-0 -translate-y-1 overflow-hidden transition-all duration-200 ease-out">
                <div class="flex items-center gap-2 pt-2">
                    <input id="textInputField" type="text" placeholder="Message..." class="flex-1 h-12 rounded-[10px] border-2 border-red-500 bg-white dark:bg-black px-4 text-[15px] text-zinc-900 dark:text-zinc-100 outline-none placeholder-zinc-400 dark:placeholder-zinc-600">
                    <button class="w-10 h-10 rounded-[10px] bg-red-500 text-white flex items-center justify-center active:scale-95 transition-transform shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 rotate-45">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                        </svg>
                    </button>
                </div>
            </div>
            <div id="voicePanel" class="max-h-0 opacity-0 -translate-y-1 overflow-hidden transition-all duration-200 ease-out">
                <div class="flex items-center gap-2 pt-2">
                    <div class="flex-1 h-12 rounded-[10px] border-2 border-red-500 bg-white dark:bg-black flex items-center px-4 gap-3">
                        <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse shrink-0"></span>
                        <div class="flex-1 flex items-center justify-center gap-1 h-5">
                            <span class="voice-bar w-[3px] h-5 bg-red-500 rounded-full" style="animation-delay: 0s"></span>
                            <span class="voice-bar w-[3px] h-5 bg-red-500 rounded-full" style="animation-delay: 0.12s"></span>
                            <span class="voice-bar w-[3px] h-5 bg-red-500 rounded-full" style="animation-delay: 0.28s"></span>
                            <span class="voice-bar w-[3px] h-5 bg-red-500 rounded-full" style="animation-delay: 0.05s"></span>
                            <span class="voice-bar w-[3px] h-5 bg-red-500 rounded-full" style="animation-delay: 0.34s"></span>
                            <span class="voice-bar w-[3px] h-5 bg-red-500 rounded-full" style="animation-delay: 0.18s"></span>
                            <span class="voice-bar w-[3px] h-5 bg-red-500 rounded-full" style="animation-delay: 0.4s"></span>
                            <span class="voice-bar w-[3px] h-5 bg-red-500 rounded-full" style="animation-delay: 0.09s"></span>
                            <span class="voice-bar w-[3px] h-5 bg-red-500 rounded-full" style="animation-delay: 0.22s"></span>
                            <span class="voice-bar w-[3px] h-5 bg-red-500 rounded-full" style="animation-delay: 0.31s"></span>
                            <span class="voice-bar w-[3px] h-5 bg-red-500 rounded-full" style="animation-delay: 0.15s"></span>
                            <span class="voice-bar w-[3px] h-5 bg-red-500 rounded-full" style="animation-delay: 0.37s"></span>
                        </div>
                        <span id="voiceTimer" class="text-red-500 text-xs font-medium shrink-0">0:00</span>
                    </div>
                    <button class="w-10 h-10 rounded-[10px] bg-red-500 text-white flex items-center justify-center active:scale-95 transition-transform shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 rotate-45">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                        </svg>
                    </button>
                </div>
            </div>
            <div id="cameraPanel" class="max-h-0 opacity-0 -translate-y-1 overflow-hidden transition-all duration-200 ease-out">
                <div class="flex items-center pt-2">
                    <div class="flex-1 h-12 rounded-[10px] border-2 border-red-500 bg-white dark:bg-black flex items-center justify-center">
                        <span class="text-red-500 text-sm font-medium">Camera not available in web demo</span>
                    </div>
                </div>
            </div>
        </div>  
    </div>
</body>
</html>
