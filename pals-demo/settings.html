<!DOCTYPE html>
<html lang="en">
<head>
	<title>Pals | Settings</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="light dark">
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="pals.js"></script>
	<style>
		.no-scrollbar::-webkit-scrollbar { display: none; }
		.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
	</style>
</head>
<body class="bg-white dark:bg-black antialiased transition-colors duration-200">
	<div class="w-full h-dvh flex flex-col bg-white dark:bg-black relative overflow-hidden mx-auto max-w-2xl">
		<header class="w-full flex justify-between items-center px-4 pt-4 pb-4 shrink-0 border-b border-zinc-100 dark:border-zinc-900">
			<a href="index.html" class="w-10 text-zinc-800 dark:text-zinc-200 active:scale-90 transition-transform">
				<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
					<path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
				</svg>
			</a>
			<img src="images/Pals_Logo.png" alt="Pals" class="h-8">
			<div class="w-10 flex justify-end items-center">
			</div>
		</header>
		<main class="flex-1 overflow-y-auto no-scrollbar px-8 py-8 text-zinc-900 dark:text-zinc-100">
			<h1 class="text-3xl font-bold text-zinc-900 dark:text-zinc-100 leading-tight mb-6">
				Settings
			</h1>
			<section class="space-y-8 mb-20">
				<div class="space-y-2">
					<p class="text-zinc-900 dark:text-zinc-100 text-xl font-bold">
						App Settings
					</p>
				</div>
				<div class="space-y-4">
					<div class="flex items-center justify-between">
						<span class="text-zinc-800 dark:text-zinc-200 text-lg font-normal">
							Read Receipts
						</span>
						<label class="relative inline-flex items-center cursor-pointer">
							<input type="checkbox" class="sr-only peer">
							<div class="w-11 h-6 bg-gray-300 dark:bg-zinc-700 rounded-full transition-colors peer-checked:bg-red-500"></div>
							<div class="absolute left-0.5 top-0.5 bg-white w-5 h-5 rounded-full transition-transform shadow-sm peer-checked:translate-x-5"></div>
						</label>
					</div>
					<p class="text-zinc-600 dark:text-zinc-400 text-base font-normal">If you turn off read receipts, your Pals can't see when you've read their messages, but you also won't be able to see when they've read yours.
					</p>
				</div>
				<div class="space-y-4">
					<div class="flex items-center justify-between">
						<span class="text-zinc-800 dark:text-zinc-200 text-lg font-normal">
							Always Match System Appearance
						</span>
						<label class="relative inline-flex items-center cursor-pointer">
							<input type="checkbox" id="systemToggle" class="sr-only peer" onchange="handleSystemToggle(this)">
							<div class="w-11 h-6 bg-gray-200 dark:bg-zinc-700 rounded-full transition-colors peer-checked:bg-red-500"></div>
							<div class="absolute left-0.5 top-0.5 bg-white w-5 h-5 rounded-full transition-transform shadow-sm peer-checked:translate-x-5"></div>
						</label>
					</div>
					<p class="text-zinc-600 dark:text-zinc-400 text-base font-normal">
					</p>
				</div>
				<div class="space-y-4">
					<div class="flex items-center justify-between">
						<span class="text-zinc-800 dark:text-zinc-200 text-lg font-normal">
							Always Use Dark Mode
						</span>
						<label class="relative inline-flex items-center cursor-pointer">
							<input type="checkbox" id="darkToggle" class="sr-only peer" onchange="handleThemeToggle(this)">
							<div class="w-11 h-6 bg-gray-200 dark:bg-zinc-700 rounded-full transition-colors peer-checked:bg-red-500 peer-disabled:opacity-50"></div>
							<div class="absolute left-0.5 top-0.5 bg-white w-5 h-5 rounded-full transition-transform shadow-sm peer-checked:translate-x-5 peer-disabled:cursor-not-allowed"></div>
						</label>
					</div>
					<p class="text-zinc-600 dark:text-zinc-400 text-base font-normal">
					</p>
				</div>
				<div class="space-y-4">
					<button onclick="window.location.href='settingsCamera.html'" class="w-full flex items-center justify-between h-6 text-zinc-800 dark:text-zinc-200 text-lg font-normal">
						<span>Camera Settings</span>
						<span class="text-zinc-400">›</span>
					</button>
					<p class="text-zinc-600 dark:text-zinc-400 text-base font-normal">
					</p>
				</div>
			</section>
			<section class="space-y-8 mb-20">
				<div class="space-y-2">
					<p class="text-zinc-900 dark:text-zinc-100 text-xl font-bold">
						Account Settings
					</p>
				</div>
				<div class="space-y-4">
					<button class="w-full flex items-center justify-between h-6 text-zinc-800 dark:text-zinc-200 text-lg font-normal">
						<span>Change Phone Number (Disabled)</span>
						<span class="text-zinc-400">›</span>
					</button>
					<p class="text-zinc-600 dark:text-zinc-400 text-base font-normal">
					</p>
				</div>
				<div class="space-y-4">
					<button class="w-full flex items-center justify-between h-6 text-zinc-800 dark:text-zinc-200 text-lg font-normal">
						<span>View Hidden Users (Disabled)</span>
						<span class="text-zinc-400">›</span>
					</button>
					<p class="text-zinc-600 dark:text-zinc-400 text-base font-normal">
					</p>
				</div>
				<div class="space-y-4">
					<button class="w-full flex items-center justify-between h-6 text-zinc-800 dark:text-zinc-200 text-lg font-normal">
						<span>View Blocked Users (Disabled)</span>
						<span class="text-zinc-400">›</span>
					</button>
					<p class="text-zinc-600 dark:text-zinc-400 text-base font-normal">
					</p>
				</div>
				<div class="space-y-4">
					<button onclick="window.location.href='delete.html'" class="w-full flex items-center justify-between h-6 text-zinc-800 dark:text-zinc-200 text-lg font-normal">
						<span>Delete Pals Account</span>
						<span class="text-zinc-400">›</span>
					</button>
					<p class="text-zinc-600 dark:text-zinc-400 text-base font-normal">
						We'll miss you
					</p>
				</div>
			</section>
		</main>
		<div class="absolute bottom-6 inset-x-0 z-50 flex items-center justify-center gap-3 px-6">
			<!-- New Group Chat -->
			<a href="newGroupChat.html" class="w-16 h-16 shrink-0 rounded-full flex items-center justify-center bg-white/60 dark:bg-zinc-900/60 backdrop-blur-2xl border border-white/60 dark:border-white/10 shadow-[0_8px_30px_rgba(0,0,0,0.12)] dark:shadow-[0_8px_30px_rgba(0,0,0,0.5)] text-zinc-700 dark:text-zinc-300 active:scale-90 transition-transform">
				<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-9 h-9">
					<path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
				</svg>
			</a>

			<!-- Messages / Profile / Settings pill -->
			<div class="flex items-center h-16 rounded-full bg-white/60 dark:bg-zinc-900/60 backdrop-blur-2xl border border-white/60 dark:border-white/10 shadow-[0_8px_30px_rgba(0,0,0,0.12)] dark:shadow-[0_8px_30px_rgba(0,0,0,0.5)] px-1.5 gap-1">
				<span class="w-14 h-14 flex items-center justify-center rounded-full text-red-500 bg-white/80 dark:bg-white/10 shadow-sm">
					<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-[30px] h-[30px]">
						<path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z" />
					</svg>
				</span>
				<button onclick="toggleProfilePanel()" class="w-14 h-14 flex items-center justify-center rounded-full text-zinc-700 dark:text-zinc-300 active:opacity-60 transition-opacity">
					<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-[30px] h-[30px]">
						<path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0ZM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
					</svg>
				</button>
				<a href="settings.html" class="w-14 h-14 flex items-center justify-center rounded-full text-zinc-700 dark:text-zinc-300 active:opacity-60 transition-opacity">
					<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-[30px] h-[30px]">
						<path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a7.65 7.65 0 010-.255c.007-.378-.138-.75-.43-.991l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.28z" />
						<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
					</svg>
				</a>
			</div>

			<!-- Search (placeholder) -->
			<button class="w-16 h-16 shrink-0 rounded-full flex items-center justify-center bg-white/60 dark:bg-zinc-900/60 backdrop-blur-2xl border border-white/60 dark:border-white/10 shadow-[0_8px_30px_rgba(0,0,0,0.12)] dark:shadow-[0_8px_30px_rgba(0,0,0,0.5)] text-zinc-700 dark:text-zinc-300 active:scale-90 transition-transform">
				<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-[30px] h-[30px]">
					<path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
				</svg>
			</button>
		</div>
	</div>
</body>
</html>
